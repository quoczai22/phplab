<!DOCTYPE html>
<html lang="en">
<body>
    <h2>Đăng ký tài khoản</h2>
    <form onsubmit="return validateAndSubmit(event)">
        <p>Họ và tên: <input type="text" id="fullname"></p>
        <p>Tên đăng nhập: <input type="text" id="username"></p>
        <p>Email: <input type="text" id="email"></p>
        <p>Số điện thoại: <input type="text" id="phone"></p>
        <p>Mật khẩu: <input type="password" id="password"></p>
        <p>Xác nhận mật khẩu: <input type="password" id="confirm_password"></p>
        <button type="submit">Đăng ký</button>
    </form>
    <p id="msg" style="color: red;"></p>

    <script>
        function validateAndSubmit(e) {
            e.preventDefault();

            let fullname = document.getElementById("fullname").value.trim();
            let username = document.getElementById("username").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let password = document.getElementById("password").value;
            let confirm = document.getElementById("confirm_password").value;

            if (!fullname || !username || !email || !phone || !password || !confirm) {
                document.getElementById("msg").innerText = "Vui lòng điền đầy đủ tất cả các trường!";
                return false;
            }

            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById("msg").innerText = "Email không hợp lệ!";
                return false;
            }

            if (password.length < 6) {
                document.getElementById("msg").innerText = "Mật khẩu phải có ít nhất 6 ký tự!";
                return false;
            }

            if (password !== confirm) {
                document.getElementById("msg").innerText = "Mật khẩu xác nhận không khớp!";
                return false;
            }

            let formData = new FormData();
            formData.append('fullname', fullname);
            formData.append('username', username);
            formData.append('email', email);
            formData.append('phone', phone);
            formData.append('password', password);

            fetch('register.php', {
                method: 'POST',
                body: formData
            })
            .then(res => res.text())
            .then(data => {
                document.getElementById("msg").style.color = "green";
                document.getElementById("msg").innerText = data;
            });

            return false;
        }
    </script>
</body>
</html>
