<!DOCTYPE html>
<html lang="en">

<body>
    <input type="number" id="age" placeholder="Nhap tuoi">
    <button onclick="checkAge()">Kiem tra</button>
    <p id="result"></p>
    <script>
        function checkAge(){
            let age = document.getElementById("age").value;
            if(age >=18){
                document.getElementById("result").innerText="Ban da du tuoi";
            } else{
                document.getElementById("result").innerText="Ban chua du tuoi";
            }
        }
    </script>    
</body>
</html>
