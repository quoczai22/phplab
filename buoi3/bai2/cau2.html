<!DOCTYPE html>
<html lang="en">

<body>
<input type="text" id="txt" placeholder="Nhap gi do">
<button onclick="showText()">Hien thi</button>
<div id="output"></div>
<script>
    function showText(){
        document.getElementById("output").innerText=document.getElementById("txt").value;
    }
</script>    
</body>
</html>
