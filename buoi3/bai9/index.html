<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 9 - Tra cứu thời tiết</title>
</head>
<body>
    <input type="text" id="city" placeholder="Nhập tên thành phố (vd: Hà Nội, Đà Nẵng, Sài Gòn...)">
    <button onclick="getWeather()">Xem</button>
    <div id="weather"></div>

    <script>
        function getWeather() {
            let c = document.getElementById("city").value;
            if (!c.trim()) return;
            fetch('weather.php?city=' + encodeURIComponent(c))
                .then(res => res.json())
                .then(data => {
                    document.getElementById("weather").innerHTML =
                        `<h3>${c}</h3><p>Nhiệt độ: ${data.temp}°C</p><p>Thời tiết: ${data.desc}</p>`;
                });
        }
    </script>
</body>
</html>
